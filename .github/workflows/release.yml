name: Release
on:
  push:
    # 只有当你推送以 v 开头的 tag 时触发（例如 v0.1.0）
    tags:
      - 'v*'
  workflow_dispatch: # 允许你在网页上手动点击触发

jobs:
  release:
    permissions:
      contents: write # 必须有这个权限才能创建 Release
    strategy:
      fail-fast: false
      matrix:
        # 这里定义我们要构建的平台
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 推荐使用 LTS 版本
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 和 Windows 不需要专门指明 target，Linux 需要
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || '' }}

      # Linux 需要安装一些系统依赖 (Webkit2GTK 等)
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      # 如果你需要构建前端 (通常 tauri action 会自动做，但显式写出来更稳妥)
      - name: Build frontend
        run: npm run build

      - name: Build the app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的 Token，无需你去设置
        with:
          tagName: ${{ github.ref_name }} # 使用你的 tag 名称作为 release 名称
          releaseName: 'PromptBox ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true # 设置为 true，构建完是草稿状态，你可以编辑说明后再点发布
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}
          # 上面这行 args 是为了让 mac 构建适配 M1/M2 芯片 (可选，如果不加默认构建 Intel 架构)